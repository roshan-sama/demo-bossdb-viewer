<ng-template #content>
  <div class="tabs" role="tablist" aria-label="Tools">
    @for (t of tabs; track t.id; let i = $index) {
      <button
        type="button"
        role="tab"
        [id]="'tab-' + t.id"
        [attr.aria-selected]="t.id === active()"
        [attr.aria-controls]="'tabpanel-' + t.id"
        [tabindex]="t.id === active() ? 0 : -1"
        (click)="active.set(t.id)"
        (keydown)="onTabKey($event, i)"
      >{{ t.label }}</button>
    }
  </div>
  @if (active() === 'edges') {
    <div role="tabpanel" id="tabpanel-edges" aria-labelledby="tab-edges">
      <app-edge-editor />
    </div>
  }
</ng-template>

@if (desktop()) {
  <aside class="tools" aria-label="Tools">
    <ng-container [ngTemplateOutlet]="content" />
  </aside>
} @else {
  <button type="button" class="tools-open" (click)="openDialog()">Tools</button>
  <dialog #dlg class="tools-dialog" aria-label="Tools" (click)="onDialogClick($event)">
    <div class="sheet">
      <div class="sheet-head">
        <strong>Tools</strong>
        <button type="button" (click)="closeDialog()">Close</button>
      </div>
      <ng-container [ngTemplateOutlet]="content" />
    </div>
  </dialog>
}
